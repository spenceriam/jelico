<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Gold gradient with slight darkness at bottom -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8c49a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d4a574;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8863d;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle with black outline -->
  <circle cx="256" cy="256" r="240" fill="url(#goldGradient)" stroke="#000000" stroke-width="12"/>

  <!-- "J" in black - Instrument Serif inspired (elegant serif style) -->
  <!-- The J has a curved bottom hook and subtle serifs -->
  <path d="
    M 280 120
    L 280 130
    L 220 130
    L 220 120
    L 250 120
    L 250 320
    Q 250 380 200 400
    Q 150 420 120 380
    L 130 365
    Q 155 395 195 380
    Q 230 365 230 320
    L 230 130
    L 200 130
    L 200 120
    Z
  " fill="#000000"/>

  <!-- Top serif bar -->
  <rect x="180" y="120" width="120" height="15" rx="2" fill="#000000"/>

  <!-- Small decorative serif at bottom of J stem -->
  <rect x="245" y="315" width="15" height="8" rx="1" fill="#000000"/>
</svg>

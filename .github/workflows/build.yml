name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a release'
        required: false
        default: 'false'
        type: boolean

env:
  NODE_VERSION: '20'

jobs:
  determine-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.release_gate.outputs.should_release }}
      version: ${{ steps.release_gate.outputs.version }}
      reason: ${{ steps.release_gate.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine if release should run
        id: release_gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_RELEASE: ${{ github.event.inputs.release || 'false' }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          package_version=$(node -p "require('./package.json').version")
          release_tag="v${package_version}"
          echo "version=${release_tag}" >> "$GITHUB_OUTPUT"

          release_exists=false
          release_status=$(curl -s -o /tmp/release.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}")
          if [[ "$release_status" == "200" ]]; then
            release_exists=true
          fi

          version_bumped=false
          if [[ "$EVENT_NAME" == "push" ]]; then
            if [[ "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
              version_bumped=true
            elif git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" -- package.json | grep -q "^package.json$"; then
              version_bumped=true
            fi
          fi

          should_release=false
          reason="Release skipped."
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$MANUAL_RELEASE" == "true" ]]; then
            if [[ "$release_exists" == "false" ]]; then
              should_release=true
              reason="Manual release requested and no release exists for package version."
            else
              reason="Manual release requested, but release already exists for package version."
            fi
          elif [[ "$EVENT_NAME" == "push" ]]; then
            if [[ "$version_bumped" == "true" && "$release_exists" == "false" ]]; then
              should_release=true
              reason="Main push includes package.json version bump and no release exists for package version."
            elif [[ "$version_bumped" == "false" ]]; then
              reason="Main push did not change package.json version."
            else
              reason="Release already exists for package version."
            fi
          fi

          echo "should_release=${should_release}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"
          echo "$reason"

  build-linux:
    needs: determine-release
    if: ${{ needs.determine-release.outputs.should_release == 'true' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build:linux -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          retention-days: 1
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
          if-no-files-found: warn

  build-windows:
    needs: determine-release
    if: ${{ needs.determine-release.outputs.should_release == 'true' }}
    permissions:
      contents: read
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build:win -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          retention-days: 1
          path: |
            release/*.exe
            release/*.msi
          if-no-files-found: warn

  build-macos:
    needs: determine-release
    if: ${{ needs.determine-release.outputs.should_release == 'true' }}
    permissions:
      contents: read
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build:mac -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # For code signing (configure secrets when ready):
          # CSC_LINK: ${{ secrets.MAC_CERTS }}
          # CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          retention-days: 1
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: warn

  release:
    needs: [determine-release, build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: ${{ needs.determine-release.outputs.should_release == 'true' }}
    env:
      MACOS_ARM_ARCH_LABEL: Apple Silicon (M-series)
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Validate release note architecture labels
        run: |
          release_body=$(sed -n '/^[[:space:]]*body: |$/,$p' .github/workflows/build.yml)
          if printf "%s\n" "$release_body" | grep -q "M1/M2/M3"; then
            echo "Deprecated architecture label found. Use 'Apple Silicon (M-series)'." >&2
            exit 1
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.determine-release.outputs.version }}
          name: Jelico ${{ needs.determine-release.outputs.version }}
          draft: true
          prerelease: false
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
          body: |
            ## Jelico ${{ needs.determine-release.outputs.version }}

            ### Downloads

            | Platform | Architecture | Download |
            |----------|-------------|----------|
            | macOS | ${{ env.MACOS_ARM_ARCH_LABEL }} | `.dmg` (arm64) |
            | macOS | Intel | `.dmg` (x64) |
            | Windows | 64-bit | `.exe` installer |
            | Linux | 64-bit | `.AppImage`, `.deb`, `.rpm` |

            ### Installation

            **macOS:** Download the `.dmg` file for your architecture, open it, and drag Jelico to Applications.

            **Windows:** Download and run the `.exe` installer.

            **Linux:**
            - AppImage: Make executable (`chmod +x`) and run
            - Debian/Ubuntu: `sudo dpkg -i jelico_*.deb`
            - Fedora/RHEL: `sudo rpm -i jelico-*.rpm`

            ### Changelog

            See [CHANGELOG.md](https://github.com/spenceriam/jelico/blob/main/CHANGELOG.md) for details.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Cache Cleanup

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: cache-cleanup
  cancel-in-progress: false

jobs:
  prune-actions-cache:
    runs-on: ubuntu-latest

    steps:
      - name: Delete caches older than 1 day
        uses: actions/github-script@v7
        with:
          script: |
            const retentionMs = 24 * 60 * 60 * 1000;
            const cutoffMs = Date.now() - retentionMs;

            const caches = await github.paginate(
              'GET /repos/{owner}/{repo}/actions/caches',
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              },
              (response) => response.data.actions_caches ?? []
            );

            let deletedCount = 0;
            let deletedBytes = 0;

            for (const cache of caches) {
              const lastAccessedAt = Date.parse(cache.last_accessed_at);
              if (Number.isNaN(lastAccessedAt) || lastAccessedAt >= cutoffMs) {
                continue;
              }

              await github.request(
                'DELETE /repos/{owner}/{repo}/actions/caches/{cache_id}',
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  cache_id: cache.id,
                }
              );

              deletedCount += 1;
              deletedBytes += cache.size_in_bytes ?? 0;

              core.info(
                `Deleted cache ${cache.id} (${cache.key}) last accessed ${cache.last_accessed_at}`
              );
            }

            const deletedGiB = (deletedBytes / 1024 ** 3).toFixed(2);

            core.info(
              `Scanned ${caches.length} cache(s); deleted ${deletedCount}; reclaimed ${deletedGiB} GiB.`
            );

            await core.summary
              .addHeading('Cache cleanup summary')
              .addTable([
                [
                  { data: 'Scanned caches', header: true },
                  String(caches.length),
                ],
                [
                  { data: 'Deleted caches', header: true },
                  String(deletedCount),
                ],
                [
                  { data: 'Reclaimed space', header: true },
                  `${deletedGiB} GiB`,
                ],
                [
                  { data: 'Retention window', header: true },
                  '1 day',
                ],
              ])
              .write();

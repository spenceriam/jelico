name: Cache Cleanup

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: cache-cleanup
  cancel-in-progress: false

jobs:
  prune-actions-cache:
    runs-on: ubuntu-latest

    steps:
      - name: Delete stale caches
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const retentionMs = 60 * 60 * 1000;
            const cutoffMs = Date.now() - retentionMs;

            // Fetch all caches (paginate auto-unwraps actions_caches)
            const caches = await github.paginate(
              'GET /repos/{owner}/{repo}/actions/caches',
              { owner, repo, per_page: 100 }
            );

            // Fetch all active branch names for stale-branch detection
            const branches = await github.paginate(
              'GET /repos/{owner}/{repo}/branches',
              { owner, repo, per_page: 100 }
            );
            const activeBranches = new Set(branches.map((b) => b.name));

            let deletedAge = 0;
            let deletedBranch = 0;
            let deletedBytes = 0;

            for (const cache of caches) {
              const createdAt = Date.parse(cache.created_at);
              const createdOld =
                !Number.isNaN(createdAt) && createdAt < cutoffMs;

              const ref = (cache.ref ?? '').replace(/^refs\/heads\//, '');
              const branchGone = ref !== '' && !activeBranches.has(ref);

              if (!createdOld && !branchGone) {
                continue;
              }

              await github.request(
                'DELETE /repos/{owner}/{repo}/actions/caches/{cache_id}',
                { owner, repo, cache_id: cache.id }
              );

              if (branchGone) {
                deletedBranch += 1;
              } else {
                deletedAge += 1;
              }
              deletedBytes += cache.size_in_bytes ?? 0;

              const reason = branchGone
                ? `dead branch (${ref})`
                : `created ${cache.created_at}`;
              core.info(
                `Deleted cache ${cache.id} (${cache.key}) - ${reason}`
              );
            }

            const deletedTotal = deletedAge + deletedBranch;
            const deletedGiB = (deletedBytes / 1024 ** 3).toFixed(2);

            core.info(
              `Scanned ${caches.length} cache(s); deleted ${deletedTotal} (${deletedAge} aged, ${deletedBranch} dead-branch); reclaimed ${deletedGiB} GiB.`
            );

            await core.summary
              .addHeading('Cache cleanup summary')
              .addTable([
                [
                  { data: 'Scanned caches', header: true },
                  String(caches.length),
                ],
                [
                  { data: 'Deleted (age > 1 hour)', header: true },
                  String(deletedAge),
                ],
                [
                  { data: 'Deleted (dead branch)', header: true },
                  String(deletedBranch),
                ],
                [
                  { data: 'Reclaimed space', header: true },
                  `${deletedGiB} GiB`,
                ],
                [
                  { data: 'Retention window', header: true },
                  '1 hour (by creation time)',
                ],
              ])
              .write();
